# MoreNeck control configuration. Raw positions are servo counts (0-4095, 4096/rev).
# Joint limits/neutral/rest/direction are rewritten by tools/calibrate.py.
loop_hz: 50
port_vid: 0x1A86
port_pid: 0x55D3   # WCH CH343 bus adapter (an ESP32 CH340 shares the vendor ID)
baudrate: 1000000

voltage_warn_below: 6.8
voltage_soft_below: 6.5
voltage_hard_below: 6.0
voltage_hard_above: 8.0

tracking_max_error_deg: 8.0
tracking_max_duration_s: 0.3
spike_ticks: 3
hold_window_s: 2.0
hard_misses: 5
soft_limit_margin_deg: 2.0
soft_hold_timeout_s: 1.0

rest_speed_deg_s: 15.0
rest_torque_fraction: 0.5
rest_done_within_deg: 3.0
near_rest_deg: 5.0
rest_timeout_s: 10.0

joints:
  turn:
    id: 4
    raw_min: 1873
    raw_max: 2918
    neutral: 2286
    rest: 2286
    direction: 1
    max_speed: 120.0
    max_accel: 400.0
    current_limit_ma: 800
    hold_current_limit_ma: 800
    temp_warn_c: 55
    temp_soft_c: 60
    temp_hard_c: 65
  nod:
    id: 3
    raw_min: 2744
    raw_max: 3133
    neutral: 2939
    rest: 3133
    direction: 1
    max_speed: 90.0
    max_accel: 300.0
    current_limit_ma: 800
    hold_current_limit_ma: 800
    temp_warn_c: 55
    temp_soft_c: 60
    temp_hard_c: 65
  lean:
    id: 1
    raw_min: 824
